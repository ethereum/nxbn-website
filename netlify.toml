# Build settings, versioned with the code rather than living only in the
# Netlify UI.
#
# This exists because of a concrete failure. When the site became a static
# export the publish directory had to change from `.next` to `out`, which
# could only be done in the UI — and that setting is site-wide. `master`
# still emitted `.next`, so it was un-deployable until the export merged, and
# every other open PR showed a failing deploy preview in the meantime.
# Keeping the config here means it travels with the branch that needs it.
#
# Secrets (the SF_* and GOOGLE_* variables) stay in the UI and are
# deliberately not mirrored here.

[build]
  command = "yarn build"
  publish = "out"

# Everything under /_next/static is content-hashed by the build, so it can be
# cached indefinitely. This header used to be injected by
# @netlify/plugin-nextjs; declaring it here means it survives that plugin
# being removed.
[[headers]]
  for = "/_next/static/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
